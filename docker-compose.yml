services:
  pipeline:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: tlc-pipeline:1.0
    env_file: .env
    # Spark usa memoria compartida para el shuffle
    shm_size: "1gb"
    volumes:
      # Capa bronce montada en SOLO LECTURA: el contenedor no puede modificarla
      - ${RUTA_BRONCE_HOST:-../TLC}:/datos/bronce:ro
      - ./plata:/app/plata
      - ./oro:/app/oro
      - ./logs:/app/logs
      - ./reportes:/app/reportes
      - ./datos_referencia:/app/datos_referencia:ro
      - ./credenciales:/app/credenciales:ro
      # El código se monta para poder editarlo sin reconstruir la imagen
      - ./src:/app/src:ro

  # Tablero: Metabase lee las tablas oro_* de BigQuery. Lo levanta scripts/montar_todo.sh
  # y lo configura metabase/configurar.py. Arranca solo cada vez que se prende la máquina.
  metabase:
    image: metabase/metabase:v0.65.6.3
    container_name: ${MB_CONTENEDOR:-metabase}
    restart: unless-stopped
    ports:
      - "${MB_PUERTO:-3001}:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - ${MB_DATOS:-${HOME}/metabase-data}:/metabase-data
